{% extends 'base.html' %}
{% block title %}Register | SmartDocs{% endblock %}
{% block auth_content %}
<div class="auth-page">
    <div class="auth-card register-card">
        <div class="auth-brand">
            <div class="brand-icon"><i class="fas fa-file-lines"></i></div>
            <div>
                <h2>SmartDocs</h2>
                <p>Secure document management</p>
            </div>
        </div>

        <h3>Create account</h3>
        <p class="auth-subtext">Set up your secure workspace to manage all important files.</p>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="register_email">Email Address</label>
                <input type="email" id="register_email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group password-group">
                <label for="register_password">Password</label>
                <div class="password-input-wrap">
                    <input type="password" id="register_password" name="password" placeholder="Create a password" required>
                    <button type="button" class="toggle-password" aria-label="Show password"><i class="fas fa-eye"></i></button>
                </div>
            </div>

            <div class="form-group password-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="password-input-wrap">
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
                    <button type="button" class="toggle-password" aria-label="Show password"><i class="fas fa-eye"></i></button>
                </div>
            </div>

            <button type="submit" class="primary-btn full-width"><i class="fas fa-user-plus"></i> Create Account</button>
        </form>

        <div class="auth-footer">
            <span>Already have an account?</span>
            <a href="{% url 'login' %}">Login here</a>
        </div>
    </div>
</div>
{% endblock %}
