{% extends 'base.html' %}
{% block title %}Login | SmartDocs{% endblock %}
{% block auth_content %}
<div class="auth-page">
    <div class="auth-card login-card">
        <div class="auth-brand">
            <div class="brand-icon"><i class="fas fa-file-lines"></i></div>
            <div>
                <h2>SmartDocs</h2>
                <p>Document Management System</p>
            </div>
        </div>

        <h3>Welcome back</h3>
        <p class="auth-subtext">Sign in to access your secure document workspace.</p>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group password-group">
                <label for="password">Password</label>
                <div class="password-input-wrap">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <button type="button" class="toggle-password" aria-label="Show password"><i class="fas fa-eye"></i></button>
                </div>
            </div>

            <div class="auth-row">
                <label class="remember-me"><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="primary-btn full-width"><i class="fas fa-sign-in-alt"></i> Login</button>
        </form>

        <div class="auth-footer">
            <span>New here?</span>
            <a href="{% url 'register' %}">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
