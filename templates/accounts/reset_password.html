{% extends 'base.html' %}
{% block title %}Reset Password | SmartDocs{% endblock %}
{% block auth_content %}
<div class="auth-page">
    <div class="auth-card login-card">
        <div class="auth-brand"><div class="brand-icon"><i class="fas fa-file-lines"></i></div><div><h2>SmartDocs</h2><p>Document Management System</p></div></div>
        <h3>Set a new password</h3>
        <p class="auth-subtext">Choose a new password for your account.</p>
        {% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}
        <form method="post">
            {% csrf_token %}
            <div class="form-group"><label for="password">New password</label><input type="password" id="password" name="password" minlength="8" required></div>
            <div class="form-group"><label for="confirm_password">Confirm password</label><input type="password" id="confirm_password" name="confirm_password" minlength="8" required></div>
            <button type="submit" class="primary-btn full-width"><i class="fas fa-key"></i> Update password</button>
        </form>
    </div>
</div>
{% endblock %}
