{% extends 'base.html' %}
{% block title %}Delete Document | SmartDocs{% endblock %}
{% block content %}
<div class="panel-area delete-confirm">
    <h1>Delete “{{ document.name }}”?</h1>
    <p>This action cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="danger-btn">Yes, Delete</button>
        <a href="{% url 'document_view' document.id %}" class="secondary-btn">Cancel</a>
    </form>
</div>
{% endblock %}
